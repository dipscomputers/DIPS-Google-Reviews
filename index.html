    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Suppress third-party chrome extension sandbox message timeouts
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        var stack = (reason && reason.stack) || '';
        if (msg.indexOf('chrome: call method') !== -1 || stack.indexOf('chrome-extension://') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || '';
        var filename = (e && e.filename) || '';
        if (msg.indexOf('chrome: call method') !== -1 || filename.indexOf('chrome-extension://') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
